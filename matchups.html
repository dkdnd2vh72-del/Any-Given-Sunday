</footer>

<script src="app.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  var weekSelect = document.getElementById("week-select");
  var allWeeks = document.querySelectorAll(".week-block");

  var teamRosterMap = {

    "Big Blue":
      "big-blue",

    "Burden Of Victory IIIx":
      "numbers",

    "#Numbers":
      "numbers",

    "# Numbers":
      "numbers",

    "Champagne Step-Papi":
      "champagne-step-papi",

    "The Bowers Rangers":
      "nabers-think-im-sellin-dope",

    "Nabers Think I'm Sellin Dope":
      "nabers-think-im-sellin-dope",

    "Gett'n Saucy":
      "gettn-saucy",

    "King Johnson":
      "king-johnson",

    "More Wins Than PSI":
      "more-wins-than-psi",

    "Injured Reserve":
      "injured-reserve",

    "Pollard Express":
      "pollard-express",

    "Chance make champions":
      "chance-make-champions"

  };


  if (weekSelect) {

    weekSelect.addEventListener(
      "change",
      function () {

        var chosenId =
          weekSelect.value;

        allWeeks.forEach(
          function (week) {

            week.style.display =
              week.id === chosenId
                ? "block"
                : "none";

          }
        );

      }
    );

  }


  function linkTeamNames() {

    var teamNames =
      document.querySelectorAll(
        ".matchup-card .team-name"
      );


    teamNames.forEach(
      function (teamNameElement) {

        if (
          teamNameElement.dataset
            .rosterLinkAdded === "true"
        ) {
          return;
        }


        var teamName =
          teamNameElement
            .textContent
            .trim()
            .replace(/\s+/g, " ");


        var rosterId =
          teamRosterMap[
            teamName
          ];


        if (!rosterId) {
          return;
        }


        if (
          teamNameElement.tagName
            .toLowerCase() === "a"
        ) {

          teamNameElement.href =
            "rosters.html?team=" +
            encodeURIComponent(
              rosterId
            );

          teamNameElement.dataset
            .rosterLinkAdded =
            "true";

          return;

        }


        var link =
          document.createElement(
            "a"
          );


        link.href =
          "rosters.html?team=" +
          encodeURIComponent(
            rosterId
          );


        link.textContent =
          teamName;

        link.style.color =
          "inherit";

        link.style.textDecoration =
          "none";

        link.style.fontWeight =
          "inherit";

        link.style.cursor =
          "pointer";


        link.addEventListener(
          "mouseenter",
          function () {

            link.style.textDecoration =
              "underline";

          }
        );


        link.addEventListener(
          "mouseleave",
          function () {

            link.style.textDecoration =
              "none";

          }
        );


        teamNameElement.textContent =
          "";

        teamNameElement.appendChild(
          link
        );


        teamNameElement.dataset
          .rosterLinkAdded =
          "true";

      }
    );

  }


  linkTeamNames();

});
</script>

</body>
</html>
