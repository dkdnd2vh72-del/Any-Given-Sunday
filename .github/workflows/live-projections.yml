name: Any Given Sunday Live Projections

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: any-given-sunday-live-projections
  cancel-in-progress: true

jobs:
  update-live-projections:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Pull ESPN matchup projections
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          python - <<'PY'
          import json, os, requests
          from datetime import datetime, timezone
          from pathlib import Path
          LEAGUE_ID="820399"; SEASON=2026
          BASE=f"https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/{SEASON}/segments/0/leagues/{LEAGUE_ID}"
          headers={"User-Agent":"Mozilla/5.0 AGS ESPN Matchup Sync","Accept":"application/json"}
          cookies={}
          if os.getenv("ESPN_S2"): cookies["espn_s2"]=os.environ["ESPN_S2"]
          if os.getenv("ESPN_SWID"): cookies["SWID"]=os.environ["ESPN_SWID"]
          r=requests.get(BASE,params=[("view","mStatus")],headers=headers,cookies=cookies,timeout=30); r.raise_for_status(); sd=r.json()
          sp=int(sd.get("scoringPeriodId") or 1); mp=int((sd.get("status") or {}).get("currentMatchupPeriod") or sp)
          r=requests.get(BASE,params=[("view","mLiveScoring"),("view","mBoxscore"),("view","mScoreboard"),("view","mMatchupScore"),("scoringPeriodId",sp),("matchupPeriodId",mp)],headers=headers,cookies=cookies,timeout=30); r.raise_for_status(); data=r.json()
          projections={}; matchups=[]
          for m in data.get("schedule",[]):
            if int(m.get("matchupPeriodId") or -1)!=mp: continue
            out={}
            for sn in ("home","away"):
              side=m.get(sn) or {}
              if "teamId" not in side: continue
              tid=str(side["teamId"])
              val=side.get("totalProjectedPointsLive")
              if val is None: val=side.get("totalProjectedPoints")
              try: val=round(float(val),2)
              except (TypeError,ValueError): val=0.0
              if val<=0: raise RuntimeError(f"No valid ESPN projection for team {tid}")
              projections[tid]=val; out[sn]={"teamId":int(tid),"projection":val}
            if "home" in out and "away" in out:
              # ESPN's app matchup percentages are derived from its matchup projection display.
              # Keep the exact projected totals from ESPN and use the same gentle scaling seen
              # in ESPN's matchup card (e.g. 129.47 vs 125.56 -> 52/48), rather than the old
              # exaggerated site-only model.
              diff=out["home"]["projection"]-out["away"]["projection"]
              home_pct=max(0,min(100,round(50+diff/2)))
              away_pct=100-home_pct
              out["home"]["percentage"]=home_pct; out["away"]["percentage"]=away_pct
              matchups.append(out)
          if not projections: raise RuntimeError("ESPN returned no matchup projections")
          vals=sorted(projections.values()); n=len(vals); med=vals[n//2] if n%2 else round((vals[n//2-1]+vals[n//2])/2,2)
          payload={"leagueId":LEAGUE_ID,"season":SEASON,"week":mp,"scoringPeriod":sp,"updatedAt":datetime.now(timezone.utc).isoformat(),"projectedMedian":med,"projections":projections,"matchups":matchups}
          Path("data").mkdir(exist_ok=True); Path("data/live-projections.json").write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n")
          PY
      - name: Commit live projections
        run: |
          if git diff --quiet -- data/live-projections.json; then exit 0; fi
          git config user.name "Any Given Sunday Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live-projections.json
          git commit -m "Update ESPN matchup projections"
          for attempt in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 3; done
          exit 1
