name: ESPN Player Rankings Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: espn-player-rankings-sync
  cancel-in-progress: true

jobs:
  update-rankings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Pull ESPN season positional ranks
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          python - <<'PY'
          import json, os, requests
          from pathlib import Path
          from datetime import datetime, timezone

          league_id="820399"; season=2026
          url=f"https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/{season}/segments/0/leagues/{league_id}"
          cookies={}
          if os.getenv("ESPN_S2"): cookies["espn_s2"]=os.environ["ESPN_S2"]
          if os.getenv("ESPN_SWID"): cookies["SWID"]=os.environ["ESPN_SWID"]
          headers={"User-Agent":"Mozilla/5.0 AGS Rankings Sync","Accept":"application/json"}
          fantasy_filter={"players":{"limit":2000,"sortPercOwned":{"sortPriority":1,"sortAsc":False}}}
          headers["x-fantasy-filter"]=json.dumps(fantasy_filter,separators=(",",":"))
          r=requests.get(url,params=[("view","kona_player_info")],headers=headers,cookies=cookies,timeout=45)
          r.raise_for_status(); data=r.json()
          pool=data.get("players",[])
          posmap={1:"QB",2:"RB",3:"WR",4:"TE",5:"K",16:"D/ST"}
          rows=[]
          for item in pool:
            p=item.get("player",item) or {}
            pos=posmap.get(int(p.get("defaultPositionId",0) or 0))
            if not pos: continue
            total=None
            for s in p.get("stats",[]) or []:
              try:
                if int(s.get("statSourceId",-1))==0 and int(s.get("scoringPeriodId",-1))==0:
                  total=float(s.get("appliedTotal",0) or 0); break
              except (TypeError,ValueError): pass
            if total is None:
              vals=[]
              for s in p.get("stats",[]) or []:
                try:
                  if int(s.get("statSourceId",-1))==0 and int(s.get("scoringPeriodId",0))>0:
                    vals.append(float(s.get("appliedTotal",0) or 0))
                except (TypeError,ValueError): pass
              total=sum(vals)
            rows.append({"id":str(p.get("id","")),"name":p.get("fullName") or p.get("name") or "","position":pos,"points":round(total,2)})
          ranks={}
          for pos in posmap.values():
            group=sorted((x for x in rows if x["position"]==pos),key=lambda x:(-x["points"],x["name"]))
            for i,x in enumerate(group,1): ranks[x["id"]]={"position":pos,"rank":i,"label":f"{pos}{i}","seasonPoints":x["points"]}
          out={"season":season,"updatedAt":datetime.now(timezone.utc).isoformat(),"players":ranks}
          Path("data").mkdir(exist_ok=True); Path("data/player-ranks.json").write_text(json.dumps(out,indent=2)+"\n")
          PY
      - name: Commit rankings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/player-ranks.json
          git diff --cached --quiet || git commit -m "Update ESPN player positional rankings"
          git push
