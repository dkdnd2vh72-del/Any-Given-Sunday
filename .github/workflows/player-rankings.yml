name: ESPN Season Player Rankings Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: espn-player-rankings-sync
  cancel-in-progress: true

jobs:
  update-rankings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Rank all ESPN players by completed season fantasy points
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          python - <<'PY'
          import json, os, requests
          from pathlib import Path
          from datetime import datetime, timezone

          league_id="820399"; season=2026
          url=f"https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/{season}/segments/0/leagues/{league_id}"
          cookies={}
          if os.getenv("ESPN_S2"): cookies["espn_s2"]=os.environ["ESPN_S2"]
          if os.getenv("ESPN_SWID"): cookies["SWID"]=os.environ["ESPN_SWID"]
          headers={"User-Agent":"Mozilla/5.0 AGS Season Rankings Sync","Accept":"application/json"}
          posmap={1:"QB",2:"RB",3:"WR",4:"TE",5:"K",16:"D/ST"}

          # ESPN status tells us the active scoring period. Rankings must only use
          # COMPLETED scoring periods, never the current week's projection/live rank.
          sr=requests.get(url,params=[("view","mStatus")],headers=headers,cookies=cookies,timeout=45)
          sr.raise_for_status(); status_data=sr.json()
          current_week=int(status_data.get("scoringPeriodId",1) or 1)
          completed_through=max(0,current_week-1)

          # Pull ESPN's complete player pool so free agents and rostered players are
          # ranked together. This is a league-wide positional season ranking.
          ph=dict(headers)
          ph["x-fantasy-filter"]=json.dumps({"players":{"limit":3000,"sortPercOwned":{"sortPriority":1,"sortAsc":False}}},separators=(",",":"))
          pr=requests.get(url,params=[("view","kona_player_info")],headers=ph,cookies=cookies,timeout=60)
          pr.raise_for_status(); pdata=pr.json()

          players={}
          for item in pdata.get("players",[]) or []:
            p=item.get("player",item) or {}
            try: pos=posmap.get(int(p.get("defaultPositionId",0) or 0))
            except (TypeError,ValueError): pos=None
            pid=str(p.get("id","") or "")
            if not pid or not pos: continue
            total=0.0
            # ESPN actual league-scored fantasy points: statSourceId 0.
            # Sum every completed weekly scoring period. Do NOT use projections
            # (statSourceId 1) or scoringPeriodId 0 season projections.
            for st in p.get("stats",[]) or []:
              try:
                sp=int(st.get("scoringPeriodId",0) or 0)
                src=int(st.get("statSourceId",-1))
              except (TypeError,ValueError):
                continue
              if src==0 and 1 <= sp <= completed_through:
                try: total += float(st.get("appliedTotal",0) or 0)
                except (TypeError,ValueError): pass
            players[pid]={"name":p.get("fullName") or p.get("name") or "","position":pos,"seasonPoints":round(total,2)}

          # ESPN can omit weekly stat rows from the broad player-pool response for
          # some rostered players. Pull each completed scoring period's rosters too
          # and merge the league-applied actual totals by player/week.
          weekly={pid:{} for pid in players}
          for week in range(1,completed_through+1):
            rr=requests.get(url,params=[("view","mRoster"),("scoringPeriodId",str(week))],headers=headers,cookies=cookies,timeout=60)
            rr.raise_for_status(); rd=rr.json()
            for team in rd.get("teams",[]) or []:
              for entry in ((team.get("roster") or {}).get("entries") or []):
                p=(entry.get("playerPoolEntry") or {}).get("player") or {}
                pid=str(p.get("id","") or "")
                try: pos=posmap.get(int(p.get("defaultPositionId",0) or 0))
                except (TypeError,ValueError): pos=None
                if not pid or not pos: continue
                if pid not in players:
                  players[pid]={"name":p.get("fullName") or p.get("name") or "","position":pos,"seasonPoints":0.0}
                score=None
                for st in p.get("stats",[]) or []:
                  try:
                    if int(st.get("statSourceId",-1))==0 and int(st.get("scoringPeriodId",0) or 0)==week:
                      score=float(st.get("appliedTotal",0) or 0); break
                  except (TypeError,ValueError): pass
                if score is not None:
                  weekly.setdefault(pid,{})[week]=score

          # Prefer the explicit sum of completed weekly league scores whenever we
          # have those rows. This guarantees Week 2 rankings are based on Week 1,
          # and later weeks automatically become true season-to-date rankings.
          for pid,weeks in weekly.items():
            if weeks:
              players[pid]["seasonPoints"]=round(sum(weeks.values()),2)

          ranks={}
          for pos in posmap.values():
            group=sorted(((pid,v) for pid,v in players.items() if v["position"]==pos),key=lambda x:(-x[1]["seasonPoints"],x[1]["name"]))
            # Competition ranking: equal season point totals receive the same rank.
            prior=None; rank=0
            for index,(pid,v) in enumerate(group,1):
              pts=v["seasonPoints"]
              if prior is None or pts != prior: rank=index
              ranks[pid]={"position":pos,"rank":rank,"label":f"{pos}{rank}","seasonPoints":pts}
              prior=pts

          out={
            "season":season,
            "currentScoringPeriod":current_week,
            "throughScoringPeriod":completed_through,
            "rankingBasis":"ESPN league actual fantasy points, season-to-date through completed scoring periods",
            "updatedAt":datetime.now(timezone.utc).isoformat(),
            "players":ranks
          }
          Path("data").mkdir(exist_ok=True)
          Path("data/player-ranks.json").write_text(json.dumps(out,indent=2)+"\n")
          print(f"Ranked {len(ranks)} players through Week {completed_through}")
          PY
      - name: Commit rankings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add data/player-ranks.json
          git diff --cached --quiet || git commit -m "Update ESPN season player positional rankings"
          git push
