      - name: Commit only when something changed
        run: |

          if git diff --quiet; then

            echo "No league changes detected. No commit needed."

            exit 0

          fi


          git config user.name \
            "Any Given Sunday Bot"


          git config user.email \
            "actions@users.noreply.github.com"


          git add \
            rosters.html \
            matchups.html \
            standings.html \
            transactions.html \
            index.html \
            data/live.json


          git commit \
            -m "Auto-update Any Given Sunday league data"


          git push