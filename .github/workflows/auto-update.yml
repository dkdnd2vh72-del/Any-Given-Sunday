name: Any Given Sunday Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: any-given-sunday-auto-update
  cancel-in-progress: false

jobs:
  update-site:
    runs-on: ubuntu-latest

    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install updater dependencies
        run: pip install requests beautifulsoup4

      - name: Pull ESPN data and update site
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}

        run: |
          python - <<'PY'

          import json
          import os
          import re
          import sys

          from pathlib import Path
          from html import escape

          import requests
          from bs4 import BeautifulSoup


          # ==========================================
          # LEAGUE SETTINGS
          # ==========================================

          LEAGUE_ID = "820399"
          SEASON = 2026

          ESPN_URL = (
              f"https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/"
              f"seasons/{SEASON}/segments/0/leagues/{LEAGUE_ID}"
          )


          # ==========================================
          # ESPN REQUEST
          # ==========================================

          params = [
              ("view", "mTeam"),
              ("view", "mRoster"),
              ("view", "mMatchup"),
              ("view", "mMatchupScore"),
              ("view", "mSettings"),
              ("view", "mStandings"),
          ]

          headers = {
              "User-Agent":
                  "Mozilla/5.0 Any-Given-Sunday-GitHub-Action/1.0",

              "Accept":
                  "application/json",
          }

          cookies = {}

          if os.getenv("ESPN_S2"):
              cookies["espn_s2"] = os.environ["ESPN_S2"]

          if os.getenv("ESPN_SWID"):
              cookies["SWID"] = os.environ["ESPN_SWID"]


          response = requests.get(
              ESPN_URL,
              params=params,
              headers=headers,
              cookies=cookies,
              timeout=30,
          )


          if response.status_code in (401, 403):

              print("ESPN rejected the request.")

              print(
                  "Check repository secrets "
                  "ESPN_S2 and ESPN_SWID."
              )

              sys.exit(2)


          response.raise_for_status()

          league = response.json()


          # ==========================================
          # CURRENT WEEK
          # ==========================================

          current_week = (
              league
              .get("status", {})
              .get("currentMatchupPeriod")

              or

              league.get("scoringPeriodId")

              or 1
          )

          current_week = int(current_week)

          print(
              f"Current matchup week: "
              f"{current_week}"
          )


          # ==========================================
          # ESPN POSITION IDS
          # ==========================================

          POSITION = {
              1: "QB",
              2: "RB",
              3: "WR",
              4: "TE",
              5: "K",
              16: "D/ST",
          }


          # ==========================================
          # ESPN LINEUP SLOT IDS
          # ==========================================

          SLOT = {
              0: "QB",
              2: "RB",
              4: "WR",
              6: "TE",
              16: "D/ST",
              17: "K",
              20: "Bench",
              21: "IR",
              23: "FLEX",
          }


          SLOT_ORDER = {
              "QB": 0,
              "RB": 1,
              "WR": 2,
              "TE": 3,
              "FLEX": 4,
              "D/ST": 5,
              "K": 6,
              "Bench": 7,
              "IR": 8,
          }


          # ==========================================
          # NFL TEAM IDS
          # ==========================================

          PRO_TEAM = {
              0: "FA",
              1: "ATL",
              2: "BUF",
              3: "CHI",
              4: "CIN",
              5: "CLE",
              6: "DAL",
              7: "DEN",
              8: "DET",
              9: "GB",
              10: "TEN",
              11: "IND",
              12: "KC",
              13: "LV",
              14: "LAR",
              15: "MIA",
              16: "MIN",
              17: "NE",
              18: "NO",
              19: "NYG",
              20: "NYJ",
              21: "PHI",
              22: "ARI",
              23: "PIT",
              24: "LAC",
              25: "SF",
              26: "SEA",
              27: "TB",
              28: "WSH",
              29: "CAR",
              30: "JAX",
              33: "BAL",
              34: "HOU",
          }


          # ==========================================
          # HELPERS
          # ==========================================

          def clean_name(value):

              return re.sub(
                  r"\s+",
                  " ",
                  (value or "").strip()
              )


          def team_name(team):

              direct = clean_name(
                  team.get("name")
              )

              if direct:
                  return direct

              return clean_name(
                  f"{team.get('location', '')} "
                  f"{team.get('nickname', '')}"
              )


          # ==========================================
          # PLAYER CURRENT WEEK PROJECTION
          # ==========================================

          def get_player_projection(player):

              stats = player.get(
                  "stats",
                  []
              )

              candidates = []

              for stat in stats:

                  try:

                      scoring_period = int(
                          stat.get(
                              "scoringPeriodId",
                              -1
                          )
                      )

                      stat_source = int(
                          stat.get(
                              "statSourceId",
                              -1
                          )
                      )

                  except (
                      TypeError,
                      ValueError
                  ):

                      continue


                  # ESPN statSourceId 1 = projection

                  if (
                      scoring_period == current_week
                      and
                      stat_source == 1
                  ):

                      try:

                          value = float(
                              stat.get(
                                  "appliedTotal",
                                  0
                              )
                              or 0
                          )

                      except (
                          TypeError,
                          ValueError
                      ):

                          value = 0.0


                      candidates.append(
                          value
                      )


              if candidates:
                  return candidates[-1]

              return 0.0


          # ==========================================
          # BUILD TEAMS + ROSTERS
          # ==========================================

          teams_by_id = {}

          normalized_teams = []


          for team in league.get(
              "teams",
              []
          ):

              tid = int(
                  team["id"]
              )

              name = team_name(
                  team
              )

              players = []

              roster_entries = (
                  team
                  .get("roster", {})
                  .get("entries", [])
              )


              for entry in roster_entries:

                  player = (
                      entry
                      .get(
                          "playerPoolEntry",
                          {}
                      )
                      .get(
                          "player",
                          {}
                      )
                  )


                  if not player:
                      continue


                  lineup_slot_id = int(
                      entry.get(
                          "lineupSlotId",
                          20
                      )
                  )


                  slot = SLOT.get(
                      lineup_slot_id,
                      "Bench"
                  )


                  default_position_id = int(
                      player.get(
                          "defaultPositionId",
                          -1
                      )
                  )


                  position = POSITION.get(
                      default_position_id,
                      "—"
                  )


                  pro_team = PRO_TEAM.get(
                      int(
                          player.get(
                              "proTeamId",
                              0
                          )
                      ),
                      ""
                  )


                  player_projection = (
                      get_player_projection(
                          player
                      )
                  )


                  players.append({
                      "id": str(
                          player.get(
                              "id",
                              ""
                          )
                      ),

                      "name": clean_name(
                          player.get(
                              "fullName"
                          )
                          or
                          player.get(
                              "name"
                          )
                      ),

                      "position":
                          position,

                      "slot":
                          slot,

                      "slotId":
                          lineup_slot_id,

                      "proTeam":
                          pro_team,

                      "projection":
                          player_projection,
                  })


              players.sort(
                  key=lambda x: (
                      SLOT_ORDER.get(
                          x["slot"],
                          99
                      ),
                      x["slotId"],
                      x["name"],
                  )
              )


              # ======================================
              # CURRENT STARTING PROJECTION
              # ======================================

              starter_projection = 0.0


              for player in players:

                  if player["slot"] in (
                      "Bench",
                      "IR"
                  ):
                      continue


                  starter_projection += float(
                      player.get(
                          "projection",
                          0
                      )
                      or 0
                  )


              starter_projection = round(
                  starter_projection,
                  2
              )


              overall = (
                  team
                  .get("record", {})
                  .get("overall", {})
              )


              item = {
                  "id":
                      tid,

                  "name":
                      name,

                  "roster":
                      players,

                  "record": {
                      "wins": int(
                          overall.get(
                              "wins",
                              0
                          )
                          or 0
                      ),

                      "losses": int(
                          overall.get(
                              "losses",
                              0
                          )
                          or 0
                      ),

                      "ties": int(
                          overall.get(
                              "ties",
                              0
                          )
                          or 0
                      ),

                      "pointsFor": float(
                          overall.get(
                              "pointsFor",
                              0
                          )
                          or 0
                      ),

                      "pointsAgainst": float(
                          overall.get(
                              "pointsAgainst",
                              0
                          )
                          or 0
                      ),
                  },

                  "projection":
                      starter_projection,
              }


              normalized_teams.append(
                  item
              )

              teams_by_id[
                  tid
              ] = item


              print(
                  f"{name}: "
                  f"starter projection "
                  f"{starter_projection:.2f}"
              )


          # ==========================================
          # BUILD CURRENT WEEK MATCHUPS
          # ==========================================

          normalized_matchups = []


          for matchup in league.get(
              "schedule",
              []
          ):

              if int(
                  matchup.get(
                      "matchupPeriodId",
                      -1
                  )
              ) != current_week:

                  continue


              matchup_item = {}


              for side_name in (
                  "home",
                  "away"
              ):

                  side = (
                      matchup.get(
                          side_name
                      )
                      or {}
                  )


                  if "teamId" not in side:
                      continue


                  tid = int(
                      side["teamId"]
                  )


                  points = float(
                      side.get(
                          "totalPoints",
                          0
                      )
                      or 0
                  )


                  projection = float(
                      teams_by_id
                      .get(
                          tid,
                          {}
                      )
                      .get(
                          "projection",
                          0
                      )
                      or 0
                  )


                  # Fallback to ESPN matchup projection

                  if projection == 0.0:

                      espn_projection = (
                          side.get(
                              "totalProjectedPointsLive"
                          )
                      )


                      if espn_projection is None:

                          espn_projection = (
                              side.get(
                                  "totalProjectedPoints"
                              )
                          )


                      if espn_projection is not None:

                          try:

                              projection = float(
                                  espn_projection
                                  or 0
                              )

                          except (
                              TypeError,
                              ValueError
                          ):

                              projection = 0.0


                  projection = round(
                      projection,
                      2
                  )


                  matchup_item[
                      side_name
                  ] = {
                      "teamId":
                          tid,

                      "teamName":
                          teams_by_id
                          .get(
                              tid,
                              {}
                          )
                          .get(
                              "name",
                              str(tid)
                          ),

                      "score":
                          points,

                      "projection":
                          projection,
                  }


              if (
                  "home" in matchup_item
                  and
                  "away" in matchup_item
              ):

                  normalized_matchups.append(
                      matchup_item
                  )


          # ==========================================
          # ACTION LOG
          # ==========================================

          print(
              "=============================="
          )

          print(
              "CURRENT MATCHUP PROJECTIONS"
          )


          for matchup in normalized_matchups:

              home = matchup["home"]
              away = matchup["away"]

              print(
                  f'{home["teamName"]}: '
                  f'{home["projection"]:.2f} '
                  f'vs '
                  f'{away["teamName"]}: '
                  f'{away["projection"]:.2f}'
              )


          print(
              "=============================="
          )


          # ==========================================
          # SAVE LIVE JSON
          # ==========================================

          normalized = {
              "leagueId":
                  LEAGUE_ID,

              "season":
                  SEASON,

              "week":
                  current_week,

              "teams":
                  sorted(
                      normalized_teams,
                      key=lambda t: t["id"]
                  ),

              "matchups":
                  normalized_matchups,
          }


          data_dir = Path(
              "data"
          )

          data_dir.mkdir(
              exist_ok=True
          )


          live_path = (
              data_dir
              /
              "live.json"
          )


          new_live = (
              json.dumps(
                  normalized,
                  indent=2,
                  sort_keys=True
              )
              +
              "\n"
          )


          if (
              not live_path.exists()
              or
              live_path.read_text(
                  encoding="utf-8"
              )
              !=
              new_live
          ):

              live_path.write_text(
                  new_live,
                  encoding="utf-8"
              )


          # ==========================================
          # FIND TEAM BY NAME
          # ==========================================

          def find_team(data_name):

              target = clean_name(
                  data_name
              ).lower()


              for team in normalized[
                  "teams"
              ]:

                  if clean_name(
                      team["name"]
                  ).lower() == target:

                      return team


              return None


          # ==========================================
          # POSITION CLASS
          # ==========================================

          def pos_class(position):

              val = (
                  position
                  .lower()
                  .replace(
                      "/",
                      ""
                  )
                  .replace(
                      " ",
                      ""
                  )
                  .replace(
                      "d/st",
                      "dst"
                  )
              )


              return (
                  "pos-"
                  +
                  re.sub(
                      r"[^a-z0-9-]",
                      "",
                      val
                  )
              )


          # ==========================================
          # PLAYER ROW
          # ==========================================

          def player_row(player):

              return (
                  '<div class="player-row">'

                  '<div class="player-info">'

                  f'<span class="team-name">'

                  f'<span class="player-position '
                  f'{pos_class(player["position"])}">'

                  f'{escape(player["position"])}'

                  '</span>'

                  f'{escape(player["name"])}'

                  '</span>'

                  f'<span class="player-meta">'

                  f'{escape(player["proTeam"])}'

                  ' &middot; '

                  f'{escape(player["slot"])}'

                  '</span>'

                  '</div>'

                  '<span class="player-points">'

                  '—'

                  '</span>'

                  '</div>'
              )


          # ==========================================
          # UPDATE ROSTERS.HTML
          # ==========================================

          def update_rosters():

              path = Path(
                  "rosters.html"
              )


              if not path.exists():
                  return


              soup = BeautifulSoup(
                  path.read_text(
                      encoding="utf-8"
                  ),
                  "html.parser"
              )


              select = soup.find(
                  id="team-select"
              )


              if not select:
                  return


              option_names = {
                  option.get("value"):
                      clean_name(
                          option.get_text(
                              " ",
                              strip=True
                          )
                      )

                  for option
                  in select.find_all(
                      "option"
                  )
              }


              for roster_div in soup.select(
                  ".roster"
              ):

                  html_id = roster_div.get(
                      "id"
                  )


                  team = find_team(
                      option_names.get(
                          html_id,
                          ""
                      )
                  )


                  if not team:
                      continue


                  starters = [
                      p

                      for p
                      in team["roster"]

                      if p["slot"]
                      not in (
                          "Bench",
                          "IR"
                      )
                  ]


                  bench = [
                      p

                      for p
                      in team["roster"]

                      if p["slot"]
                      == "Bench"
                  ]


                  ir = [
                      p

                      for p
                      in team["roster"]

                      if p["slot"]
                      == "IR"
                  ]


                  starter_rank = {
                      "QB": 0,
                      "RB": 1,
                      "WR": 2,
                      "TE": 3,
                      "FLEX": 4,
                      "D/ST": 5,
                      "K": 6,
                  }


                  starters.sort(
                      key=lambda p: (
                          starter_rank.get(
                              p["slot"],
                              99
                          ),

                          p["name"]
                      )
                  )


                  projected = float(
                      team["projection"]
                      or 0
                  )


                  inner = (
                      '<div class="projection-total">'

                      '<span>'

                      f'Week {current_week} '
                      'Projected Total'

                      '</span>'

                      '<strong>'

                      f'{projected:.2f}'

                      '</strong>'

                      '</div>'


                      '<h2 class="section-title">'

                      'Starters'

                      '</h2>'


                      '<div class="starter-order-note">'

                      'QB · RB · RB · WR · WR · '
                      'TE · FLEX · D/ST · K'

                      '</div>'


                      '<div class="card">'

                      +
                      ''.join(
                          player_row(p)
                          for p
                          in starters
                      )

                      +
                      '</div>'


                      '<h2 class="section-title bench-title">'

                      'Bench'

                      '</h2>'


                      '<div class="card">'

                      +
                      ''.join(
                          player_row(p)
                          for p
                          in bench
                      )

                      +
                      '</div>'
                  )


                  if ir:

                      inner += (
                          '<h2 class="section-title bench-title">'

                          'IR'

                          '</h2>'

                          '<div class="card">'

                          +
                          ''.join(
                              player_row(p)
                              for p
                              in ir
                          )

                          +
                          '</div>'
                      )


                  fragment = BeautifulSoup(
                      inner,
                      "html.parser"
                  )


                  roster_div.clear()


                  for child in list(
                      fragment.contents
                  ):

                      roster_div.append(
                          child
                      )


              path.write_text(
                  str(soup),
                  encoding="utf-8"
              )


          # ==========================================
          # UPDATE MATCHUPS.HTML
          # ==========================================

          def update_matchups():

              path = Path(
                  "matchups.html"
              )


              if not path.exists():

                  print(
                      "WARNING: "
                      "matchups.html not found"
                  )

                  return


              soup = BeautifulSoup(
                  path.read_text(
                      encoding="utf-8"
                  ),
                  "html.parser"
              )


              # Find current week's existing block.
              # Example:
              # <div class="week-block" id="week-1">

              current_week_block = soup.find(
                  "div",
                  {
                      "class": "week-block",
                      "id": f"week-{current_week}"
                  }
              )


              if current_week_block is None:

                  print(
                      f"WARNING: "
                      f"#week-{current_week} "
                      f"was not found in "
                      f"matchups.html"
                  )

                  return


              # Update week heading

              heading = (
                  current_week_block
                  .find(
                      "h2",
                      class_="section-title"
                  )
              )


              if heading:

                  heading.string = (
                      f"Week "
                      f"{current_week} "
                      f"Matchups"
                  )


              # Remove only current week's
              # existing matchup cards

              existing_cards = (
                  current_week_block
                  .find_all(
                      "div",
                      class_="matchup-card",
                      recursive=False
                  )
              )


              for card in existing_cards:

                  card.decompose()


              # Add live current-week matchup cards
              # using the SAME structure as
              # your existing matchups.html

              for matchup in normalized[
                  "matchups"
              ]:

                  home = matchup[
                      "home"
                  ]

                  away = matchup[
                      "away"
                  ]


                  card_html = f"""
                  <div class="card matchup-card">

                    <div class="team-line">

                      <span class="team-name">{escape(home["teamName"])}</span>

                      <span class="team-score">
                        {home["score"]:.2f}<br/>

                        <span style="font-size: 0.75rem; font-style: italic; font-weight: normal;">
                          {home["projection"]:.2f}
                        </span>

                      </span>

                    </div>

                    <div class="matchup-vs">
                      vs
                    </div>

                    <div class="team-line">

                      <span class="team-name">{escape(away["teamName"])}</span>

                      <span class="team-score">
                        {away["score"]:.2f}<br/>

                        <span style="font-size: 0.75rem; font-style: italic; font-weight: normal;">
                          {away["projection"]:.2f}
                        </span>

                      </span>

                    </div>

                  </div>
                  """


                  fragment = BeautifulSoup(
                      card_html,
                      "html.parser"
                  )


                  new_card = (
                      fragment
                      .find(
                          "div",
                          class_="matchup-card"
                      )
                  )


                  if new_card:

                      current_week_block.append(
                          new_card
                      )


              path.write_text(
                  str(soup),
                  encoding="utf-8"
              )


              print(
                  f"matchups.html updated: "
                  f"Week {current_week}, "
                  f"{len(normalized['matchups'])} "
                  f"matchups"
              )


              for matchup in normalized[
                  "matchups"
              ]:

                  home = matchup[
                      "home"
                  ]

                  away = matchup[
                      "away"
                  ]


                  print(
                      f'{home["teamName"]} '
                      f'{home["score"]:.2f} '
                      f'({home["projection"]:.2f}) '
                      f'vs '
                      f'{away["teamName"]} '
                      f'{away["score"]:.2f} '
                      f'({away["projection"]:.2f})'
                  )


          # ==========================================
          # UPDATE HOME PAGE CURRENT WEEK
          # ==========================================

          def update_home_week():

              path = Path(
                  "index.html"
              )


              if not path.exists():
                  return


              soup = BeautifulSoup(
                  path.read_text(
                      encoding="utf-8"
                  ),
                  "html.parser"
              )


              for heading in soup.find_all(
                  [
                      "h2",
                      "h3"
                  ]
              ):

                  heading_text = clean_name(
                      heading.get_text(
                          " ",
                          strip=True
                      )
                  ).lower()


                  if (
                      heading_text
                      == "current week"
                  ):

                      card = (
                          heading
                          .find_next_sibling()
                      )


                      if card:

                          number = (
                              card.select_one(
                                  ".stat-number"
                              )
                          )


                          if number:

                              number.string = (
                                  f"Week "
                                  f"{current_week}"
                              )


                      break


              path.write_text(
                  str(soup),
                  encoding="utf-8"
              )


          # ==========================================
          # RUN UPDATES
          # ==========================================

          update_rosters()

          update_matchups()

          update_home_week()


          print(
              f"ESPN sync complete: "
              f"week {current_week}, "
              f"{len(normalized['teams'])} teams, "
              f"{len(normalized['matchups'])} matchups."
          )

          PY


      - name: Commit only when something changed
        run: |

          if git diff --quiet; then

            echo "No league changes detected. No commit needed."

            exit 0

          fi


          git config user.name \
            "Any Given Sunday Bot"


          git config user.email \
            "actions@users.noreply.github.com"


          git add \
            rosters.html \
            matchups.html \
            index.html \
            data/live.json


          git commit \
            -m "Auto-update Any Given Sunday league data"


          git push