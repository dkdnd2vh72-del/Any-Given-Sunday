name: Any Given Sunday Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: any-given-sunday-auto-update
  cancel-in-progress: false

jobs:
  update-site:
    runs-on: ubuntu-latest

    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install updater dependencies
        run: pip install requests beautifulsoup4

      - name: Pull ESPN data and update site
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}

        run: |
          python - <<'PY'

          import json
          import os
          import re
          import sys

          from pathlib import Path
          from html import escape

          import requests
          from bs4 import BeautifulSoup


          LEAGUE_ID = "820399"
          SEASON = 2026

          ESPN_URL = (
              f"https://lm-api-reads.fantasy.espn.com/"
              f"apis/v3/games/ffl/seasons/{SEASON}/"
              f"segments/0/leagues/{LEAGUE_ID}"
          )


          TEAM_HTML_ID = {
              1: "big-blue",
              3: "numbers",
              4: "champagne-step-papi",
              5: "nabers-think-im-sellin-dope",
              7: "gettn-saucy",
              8: "king-johnson",
              11: "more-wins-than-psi",
              12: "injured-reserve",
              13: "pollard-express",
              14: "chance-make-champions",
          }


          POSITION = {
              1: "QB",
              2: "RB",
              3: "WR",
              4: "TE",
              5: "K",
              16: "D/ST",
          }


          SLOT = {
              0: "QB",
              2: "RB",
              4: "WR",
              6: "TE",
              16: "D/ST",
              17: "K",
              20: "Bench",
              21: "IR",
              23: "FLEX",
          }


          SLOT_ORDER = {
              "QB": 0,
              "RB": 1,
              "WR": 2,
              "TE": 3,
              "FLEX": 4,
              "D/ST": 5,
              "K": 6,
              "Bench": 7,
              "IR": 8,
          }


          PRO_TEAM = {
              0: "FA",
              1: "ATL",
              2: "BUF",
              3: "CHI",
              4: "CIN",
              5: "CLE",
              6: "DAL",
              7: "DEN",
              8: "DET",
              9: "GB",
              10: "TEN",
              11: "IND",
              12: "KC",
              13: "LV",
              14: "LAR",
              15: "MIA",
              16: "MIN",
              17: "NE",
              18: "NO",
              19: "NYG",
              20: "NYJ",
              21: "PHI",
              22: "ARI",
              23: "PIT",
              24: "LAC",
              25: "SF",
              26: "SEA",
              27: "TB",
              28: "WSH",
              29: "CAR",
              30: "JAX",
              33: "BAL",
              34: "HOU",
          }


          def clean_name(value):
              return re.sub(
                  r"\s+",
                  " ",
                  (value or "").strip()
              )


          def safe_float(value):
              try:
                  return float(value or 0)
              except (TypeError, ValueError):
                  return 0.0


          def safe_int(value):
              try:
                  return int(value or 0)
              except (TypeError, ValueError):
                  return 0


          def team_name(team):
              direct = clean_name(
                  team.get("name")
              )

              if direct:
                  return direct

              return clean_name(
                  f"{team.get('location', '')} "
                  f"{team.get('nickname', '')}"
              )


          headers = {
              "User-Agent":
                  "Mozilla/5.0 Any-Given-Sunday-GitHub-Action/1.0",

              "Accept":
                  "application/json",
          }


          cookies = {}

          if os.getenv("ESPN_S2"):
              cookies["espn_s2"] = os.environ[
                  "ESPN_S2"
              ]

          if os.getenv("ESPN_SWID"):
              cookies["SWID"] = os.environ[
                  "ESPN_SWID"
              ]


          # ==========================================
          # FIRST REQUEST:
          # FIND CURRENT ESPN SCORING PERIOD
          # ==========================================

          first_params = [
              ("view", "mSettings"),
              ("view", "mStatus"),
          ]


          first_response = requests.get(
              ESPN_URL,
              params=first_params,
              headers=headers,
              cookies=cookies,
              timeout=30,
          )


          if first_response.status_code in (
              401,
              403
          ):

              print(
                  "ESPN rejected the request."
              )

              print(
                  "Check ESPN_S2 and ESPN_SWID."
              )

              sys.exit(2)


          first_response.raise_for_status()

          first_data = first_response.json()


          current_scoring_period = safe_int(
              first_data.get(
                  "scoringPeriodId",
                  1
              )
          )


          current_matchup_period = safe_int(
              first_data
              .get(
                  "status",
                  {}
              )
              .get(
                  "currentMatchupPeriod",
                  current_scoring_period
              )
          )


          if current_scoring_period <= 0:
              current_scoring_period = 1

          if current_matchup_period <= 0:
              current_matchup_period = (
                  current_scoring_period
              )


          print(
              "Current ESPN scoring period: "
              f"{current_scoring_period}"
          )

          print(
              "Current matchup period: "
              f"{current_matchup_period}"
          )


          # ==========================================
          # SECOND REQUEST:
          # GET CURRENT LIVE TEAM / ROSTER / SCORES
          #
          # scoringPeriodId is important here.
          # ==========================================

          params = [
              ("view", "mTeam"),
              ("view", "mRoster"),
              ("view", "mMatchup"),
              ("view", "mMatchupScore"),
              ("view", "mSettings"),
              ("view", "mStandings"),
              (
                  "scoringPeriodId",
                  current_scoring_period
              ),
          ]


          response = requests.get(
              ESPN_URL,
              params=params,
              headers=headers,
              cookies=cookies,
              timeout=30,
          )


          if response.status_code in (
              401,
              403
          ):

              print(
                  "ESPN rejected live-data request."
              )

              sys.exit(2)


          response.raise_for_status()

          league = response.json()


          # ==========================================
          # PLAYER STATS
          #
          # statSourceId 0 = actual
          # statSourceId 1 = projection
          # ==========================================

          def get_player_stat(
              player,
              stat_source_id
          ):

              stats = player.get(
                  "stats",
                  []
              )

              matching = []


              for stat in stats:

                  try:

                      period = int(
                          stat.get(
                              "scoringPeriodId",
                              -1
                          )
                      )

                      source = int(
                          stat.get(
                              "statSourceId",
                              -1
                          )
                      )

                  except (
                      TypeError,
                      ValueError
                  ):

                      continue


                  if (
                      period
                      ==
                      current_scoring_period
                      and
                      source
                      ==
                      stat_source_id
                  ):

                      matching.append(
                          safe_float(
                              stat.get(
                                  "appliedTotal",
                                  0
                              )
                          )
                      )


              if matching:
                  return matching[-1]


              return 0.0


          def get_player_actual(player):
              return get_player_stat(
                  player,
                  0
              )


          def get_player_projection(player):
              return get_player_stat(
                  player,
                  1
              )


          # ==========================================
          # NORMALIZE TEAMS
          # ==========================================

          teams_by_id = {}
          normalized_teams = []


          for team in league.get(
              "teams",
              []
          ):

              tid = safe_int(
                  team.get("id")
              )

              name = team_name(
                  team
              )


              roster_entries = (
                  team
                  .get(
                      "roster",
                      {}
                  )
                  .get(
                      "entries",
                      []
                  )
              )


              players = []


              for entry in roster_entries:

                  player = (
                      entry
                      .get(
                          "playerPoolEntry",
                          {}
                      )
                      .get(
                          "player",
                          {}
                      )
                  )


                  if not player:
                      continue


                  lineup_slot_id = safe_int(
                      entry.get(
                          "lineupSlotId",
                          20
                      )
                  )


                  slot = SLOT.get(
                      lineup_slot_id,
                      "Bench"
                  )


                  default_position_id = (
                      safe_int(
                          player.get(
                              "defaultPositionId",
                              -1
                          )
                      )
                  )


                  position = POSITION.get(
                      default_position_id,
                      "—"
                  )


                  pro_team = PRO_TEAM.get(
                      safe_int(
                          player.get(
                              "proTeamId",
                              0
                          )
                      ),
                      ""
                  )


                  projection = (
                      get_player_projection(
                          player
                      )
                  )


                  actual = (
                      get_player_actual(
                          player
                      )
                  )


                  players.append({
                      "id":
                          str(
                              player.get(
                                  "id",
                                  ""
                              )
                          ),

                      "name":
                          clean_name(
                              player.get(
                                  "fullName"
                              )
                              or
                              player.get(
                                  "name"
                              )
                          ),

                      "position":
                          position,

                      "slot":
                          slot,

                      "slotId":
                          lineup_slot_id,

                      "proTeam":
                          pro_team,

                      "projection":
                          round(
                              projection,
                              2
                          ),

                      "actual":
                          round(
                              actual,
                              2
                          ),
                  })


              players.sort(
                  key=lambda p: (
                      SLOT_ORDER.get(
                          p["slot"],
                          99
                      ),
                      p["slotId"],
                      p["name"],
                  )
              )


              starter_projection = sum(
                  safe_float(
                      p.get(
                          "projection",
                          0
                      )
                  )
                  for p in players
                  if p.get("slot")
                  not in (
                      "Bench",
                      "IR"
                  )
              )


              starter_actual = sum(
                  safe_float(
                      p.get(
                          "actual",
                          0
                      )
                  )
                  for p in players
                  if p.get("slot")
                  not in (
                      "Bench",
                      "IR"
                  )
              )


              overall = (
                  team
                  .get(
                      "record",
                      {}
                  )
                  .get(
                      "overall",
                      {}
                  )
              )


              acquisitions = safe_int(
                  team
                  .get(
                      "transactionCounter",
                      {}
                  )
                  .get(
                      "acquisitions",
                      0
                  )
              )


              item = {
                  "id":
                      tid,

                  "name":
                      name,

                  "htmlId":
                      TEAM_HTML_ID.get(
                          tid,
                          f"team-{tid}"
                      ),

                  "roster":
                      players,

                  "record": {
                      "wins":
                          safe_int(
                              overall.get(
                                  "wins"
                              )
                          ),

                      "losses":
                          safe_int(
                              overall.get(
                                  "losses"
                              )
                          ),

                      "ties":
                          safe_int(
                              overall.get(
                                  "ties"
                              )
                          ),

                      "pointsFor":
                          safe_float(
                              overall.get(
                                  "pointsFor"
                              )
                          ),

                      "pointsAgainst":
                          safe_float(
                              overall.get(
                                  "pointsAgainst"
                              )
                          ),
                  },

                  "projection":
                      round(
                          starter_projection,
                          2
                      ),

                  "actual":
                      round(
                          starter_actual,
                          2
                      ),

                  "acquisitions":
                      acquisitions,

                  "playoffSeed":
                      safe_int(
                          team.get(
                              "playoffSeed",
                              99
                          )
                      ),
              }


              teams_by_id[
                  tid
              ] = item

              normalized_teams.append(
                  item
              )


              print(
                  f"TEAM {tid}: "
                  f"{name} | "
                  f"Actual {starter_actual:.2f} | "
                  f"Projected "
                  f"{starter_projection:.2f} | "
                  f"Adds {acquisitions}"
              )


              for p in players:

                  print(
                      "   "
                      f"{p['slot']} "
                      f"{p['name']}: "
                      f"actual "
                      f"{p['actual']:.2f} | "
                      f"proj "
                      f"{p['projection']:.2f}"
                  )


          # ==========================================
          # MATCHUPS
          # ==========================================

          normalized_matchups = []


          for matchup in league.get(
              "schedule",
              []
          ):

              if safe_int(
                  matchup.get(
                      "matchupPeriodId",
                      -1
                  )
              ) != current_matchup_period:

                  continue


              normalized_matchup = {}


              for side_name in (
                  "home",
                  "away"
              ):

                  side = matchup.get(
                      side_name
                  ) or {}


                  if "teamId" not in side:
                      continue


                  tid = safe_int(
                      side.get(
                          "teamId"
                      )
                  )


                  team_info = teams_by_id.get(
                      tid,
                      {}
                  )


                  # ESPN schedule total
                  espn_total = safe_float(
                      side.get(
                          "totalPoints",
                          0
                      )
                  )


                  # Our sum of current active
                  # lineup actual fantasy points.
                  roster_actual = safe_float(
                      team_info.get(
                          "actual",
                          0
                      )
                  )


                  # Prefer ESPN official total when
                  # ESPN is supplying a real score.
                  #
                  # Otherwise fall back to summed
                  # starter actual points.
                  if espn_total != 0:
                      actual_score = espn_total
                  else:
                      actual_score = roster_actual


                  projection = safe_float(
                      team_info.get(
                          "projection",
                          0
                      )
                  )


                  if projection == 0:

                      projection = safe_float(
                          side.get(
                              "totalProjectedPointsLive",
                              side.get(
                                  "totalProjectedPoints",
                                  0
                              )
                          )
                      )


                  normalized_matchup[
                      side_name
                  ] = {
                      "teamId":
                          tid,

                      "teamName":
                          team_info.get(
                              "name",
                              str(tid)
                          ),

                      "score":
                          round(
                              actual_score,
                              2
                          ),

                      "projection":
                          round(
                              projection,
                              2
                          ),
                  }


                  print(
                      f"MATCHUP {side_name}: "
                      f"{team_info.get('name', tid)} | "
                      f"ESPN total "
                      f"{espn_total:.2f} | "
                      f"Roster actual "
                      f"{roster_actual:.2f} | "
                      f"Using "
                      f"{actual_score:.2f}"
                  )


              if (
                  "home"
                  in normalized_matchup
                  and
                  "away"
                  in normalized_matchup
              ):

                  normalized_matchups.append(
                      normalized_matchup
                  )


          normalized = {
              "leagueId":
                  LEAGUE_ID,

              "season":
                  SEASON,

              "week":
                  current_matchup_period,

              "scoringPeriod":
                  current_scoring_period,

              "teams":
                  sorted(
                      normalized_teams,
                      key=lambda t: t["id"]
                  ),

              "matchups":
                  normalized_matchups,
          }


          # ==========================================
          # SAVE LIVE JSON
          # ==========================================

          data_dir = Path(
              "data"
          )

          data_dir.mkdir(
              exist_ok=True
          )


          live_path = (
              data_dir
              /
              "live.json"
          )


          new_live = (
              json.dumps(
                  normalized,
                  indent=2,
                  sort_keys=True
              )
              +
              "\n"
          )


          live_path.write_text(
              new_live,
              encoding="utf-8"
          )


          # ==========================================
          # HTML HELPERS
          # ==========================================

          def pos_class(position):

              if position == "D/ST":
                  return "pos-dst"

              return (
                  "pos-"
                  +
                  re.sub(
                      r"[^a-z0-9]",
                      "",
                      position.lower()
                  )
              )


          def player_row(player):

              actual = safe_float(
                  player.get(
                      "actual",
                      0
                  )
              )


              return (
                  '<div class="player-row">'

                  '<div class="player-info">'

                  '<span class="team-name">'

                  f'<span class="player-position '
                  f'{pos_class(player["position"])}">'

                  f'{escape(player["position"])}'

                  '</span>'

                  f'{escape(player["name"])}'

                  '</span>'

                  '<span class="player-meta">'

                  f'{escape(player["proTeam"])}'

                  ' &middot; '

                  f'{escape(player["slot"])}'

                  '</span>'

                  '</div>'

                  '<span class="player-points">'

                  f'{actual:.2f}'

                  '</span>'

                  '</div>'
              )


          # ==========================================
          # ROSTERS.HTML
          # ==========================================

          def update_rosters():

              path = Path(
                  "rosters.html"
              )


              if not path.exists():

                  print(
                      "WARNING: rosters.html "
                      "not found"
                  )

                  return


              soup = BeautifulSoup(
                  path.read_text(
                      encoding="utf-8"
                  ),
                  "html.parser"
              )


              select = soup.find(
                  id="team-select"
              )


              if select:

                  for team in normalized[
                      "teams"
                  ]:

                      option = select.find(
                          "option",
                          attrs={
                              "value":
                                  team[
                                      "htmlId"
                                  ]
                          }
                      )


                      if option:

                          option.string = (
                              team["name"]
                          )


              for team in normalized[
                  "teams"
              ]:

                  roster_div = soup.find(
                      "div",
                      {
                          "class":
                              "roster",

                          "id":
                              team["htmlId"]
                      }
                  )


                  if not roster_div:

                      print(
                          "WARNING: roster div "
                          f"{team['htmlId']} "
                          "not found"
                      )

                      continue


                  starters = [
                      p
                      for p
                      in team["roster"]
                      if p["slot"]
                      not in (
                          "Bench",
                          "IR"
                      )
                  ]


                  bench = [
                      p
                      for p
                      in team["roster"]
                      if p["slot"]
                      ==
                      "Bench"
                  ]


                  ir = [
                      p
                      for p
                      in team["roster"]
                      if p["slot"]
                      ==
                      "IR"
                  ]


                  starters.sort(
                      key=lambda p: (
                          SLOT_ORDER.get(
                              p["slot"],
                              99
                          ),
                          p["name"]
                      )
                  )


                  inner = (
                      '<div class="projection-total">'

                      '<span>'

                      f'Week '
                      f'{current_matchup_period} '
                      'Projected Total'

                      '</span>'

                      '<strong>'

                      f'{team["projection"]:.2f}'

                      '</strong>'

                      '</div>'

                      '<h2 class="section-title">'
                      'Starters'
                      '</h2>'

                      '<div class="starter-order-note">'

                      'QB · RB · RB · WR · WR · '
                      'TE · FLEX · D/ST · K'

                      '</div>'

                      '<div class="card">'

                      +
                      ''.join(
                          player_row(p)
                          for p
                          in starters
                      )

                      +
                      '</div>'

                      '<h2 class="section-title '
                      'bench-title">'
                      'Bench'
                      '</h2>'

                      '<div class="card">'

                      +
                      ''.join(
                          player_row(p)
                          for p
                          in bench
                      )

                      +
                      '</div>'
                  )


                  if ir:

                      inner += (
                          '<h2 class="section-title '
                          'bench-title">'
                          'IR'
                          '</h2>'

                          '<div class="card">'

                          +
                          ''.join(
                              player_row(p)
                              for p
                              in ir
                          )

                          +
                          '</div>'
                      )


                  roster_div.clear()


                  fragment = BeautifulSoup(
                      inner,
                      "html.parser"
                  )


                  for child in list(
                      fragment.contents
                  ):

                      roster_div.append(
                          child
                      )


              path.write_text(
                  str(soup),
                  encoding="utf-8"
              )


              print(
                  "rosters.html updated "
                  "with live player scores"
              )


          # ==========================================
          # MATCHUPS.HTML
          # ==========================================

          def update_matchups():

              path = Path(
                  "matchups.html"
              )


              if not path.exists():

                  print(
                      "WARNING: matchups.html "
                      "not found"
                  )

                  return


              soup = BeautifulSoup(
                  path.read_text(
                      encoding="utf-8"
                  ),
                  "html.parser"
              )


              current_week_block = soup.find(
                  "div",
                  {
                      "class":
                          "week-block",

                      "id":
                          f"week-"
                          f"{current_matchup_period}"
                  }
              )


              if not current_week_block:

                  print(
                      "WARNING: matchup block "
                      f"week-"
                      f"{current_matchup_period} "
                      "not found"
                  )

                  return


              heading = (
                  current_week_block.find(
                      "h2",
                      class_="section-title"
                  )
              )


              if heading:

                  heading.string = (
                      f"Week "
                      f"{current_matchup_period} "
                      f"Matchups"
                  )


              existing_cards = (
                  current_week_block.find_all(
                      "div",
                      class_="matchup-card",
                      recursive=False
                  )
              )


              for card in existing_cards:
                  card.decompose()


              for matchup in normalized[
                  "matchups"
              ]:

                  home = matchup[
                      "home"
                  ]

                  away = matchup[
                      "away"
                  ]


                  card_html = f"""
                  <div class="card matchup-card">

                    <div class="team-line">

                      <span class="team-name">
                        {escape(home["teamName"])}
                      </span>

                      <span class="team-score">

                        {home["score"]:.2f}

                        <br/>

                        <span
                          style="
                            font-size: 0.75rem;
                            font-style: italic;
                            font-weight: normal;
                          "
                        >
                          {home["projection"]:.2f}
                        </span>

                      </span>

                    </div>

                    <div class="matchup-vs">
                      vs
                    </div>

                    <div class="team-line">

                      <span class="team-name">
                        {escape(away["teamName"])}
                      </span>

                      <span class="team-score">

                        {away["score"]:.2f}

                        <br/>

                        <span
                          style="
                            font-size: 0.75rem;
                            font-style: italic;
                            font-weight: normal;
                          "
                        >
                          {away["projection"]:.2f}
                        </span>

                      </span>

                    </div>

                  </div>
                  """


                  fragment = BeautifulSoup(
                      card_html,
                      "html.parser"
                  )


                  card = fragment.find(
                      "div",
                      class_="matchup-card"
                  )


                  if card:

                      current_week_block.append(
                          card
                      )


              path.write_text(
                  str(soup),
                  encoding="utf-8"
              )


              print(
                  "matchups.html updated "
                  "with live actual scores"
              )


          # ==========================================
          # STANDINGS.HTML
          # ==========================================

          def update_standings():

              path = Path(
                  "standings.html"
              )


              if not path.exists():
                  return


              soup = BeautifulSoup(
                  path.read_text(
                      encoding="utf-8"
                  ),
                  "html.parser"
              )


              table = soup.find(
                  "table",
                  class_="standings-table"
              )


              if not table:
                  return


              tbody = table.find(
                  "tbody"
              )


              if not tbody:
                  return


              tbody.clear()


              teams = sorted(
                  normalized["teams"],
                  key=lambda t: (
                      (
                          t["playoffSeed"]
                          if t["playoffSeed"] > 0
                          else 99
                      ),
                      -t["record"]["wins"],
                      -t["record"]["pointsFor"],
                      t["id"],
                  )
              )


              for team in teams:

                  record = team[
                      "record"
                  ]


                  html = (
                      "<tr>"

                      f"<td>"
                      f"{escape(team['name'])}"
                      f"</td>"

                      '<td class="num">'
                      f'{record["wins"]}'
                      '</td>'

                      '<td class="num">'
                      f'{record["losses"]}'
                      '</td>'

                      '<td class="num">'
                      f'{record["pointsFor"]:.2f}'
                      '</td>'

                      "</tr>"
                  )


                  row = BeautifulSoup(
                      html,
                      "html.parser"
                  ).find("tr")


                  if row:

                      tbody.append(
                          row
                      )


              path.write_text(
                  str(soup),
                  encoding="utf-8"
              )


          # ==========================================
          # TRANSACTIONS.HTML
          # ==========================================

          def update_transactions():

              path = Path(
                  "transactions.html"
              )


              if not path.exists():
                  return


              soup = BeautifulSoup(
                  path.read_text(
                      encoding="utf-8"
                  ),
                  "html.parser"
              )


              table = soup.find(
                  "table",
                  id="transaction-counter-table"
              )


              if table:

                  tbody = table.find(
                      "tbody"
                  )


                  if tbody:

                      for row in tbody.find_all(
                          "tr",
                          recursive=False
                      ):

                          tid = safe_int(
                              row.get(
                                  "data-team-id",
                                  0
                              )
                          )


                          if tid not in teams_by_id:
                              continue


                          team = teams_by_id[
                              tid
                          ]


                          adds = safe_int(
                              team.get(
                                  "acquisitions",
                                  0
                              )
                          )


                          cells = row.find_all(
                              "td",
                              recursive=False
                          )


                          if len(cells) >= 3:

                              cells[0].string = (
                                  team["name"]
                              )

                              cells[1].string = (
                                  str(adds)
                              )

                              cells[2].string = (
                                  f"${adds}"
                              )


              # Keeper team names

              keepers = soup.find(
                  id="keepers-card"
              )


              if keepers:

                  for row in keepers.select(
                      "[data-team-id]"
                  ):

                      tid = safe_int(
                          row.get(
                              "data-team-id",
                              0
                          )
                      )


                      if tid in teams_by_id:

                          el = row.select_one(
                              ".player-name"
                          )


                          if el:

                              el.string = (
                                  teams_by_id[
                                      tid
                                  ]["name"]
                              )


              # Dues team names

              dues = soup.find(
                  id="league-dues-card"
              )


              if dues:

                  for row in dues.select(
                      "[data-team-id]"
                  ):

                      tid = safe_int(
                          row.get(
                              "data-team-id",
                              0
                          )
                      )


                      if tid in teams_by_id:

                          el = row.select_one(
                              ".standing-info"
                          )


                          if el:

                              el.string = (
                                  teams_by_id[
                                      tid
                                  ]["name"]
                              )


              path.write_text(
                  str(soup),
                  encoding="utf-8"
              )


          # ==========================================
          # INDEX.HTML
          # ==========================================

          def update_home():

              path = Path(
                  "index.html"
              )


              if not path.exists():
                  return


              soup = BeautifulSoup(
                  path.read_text(
                      encoding="utf-8"
                  ),
                  "html.parser"
              )


              current = soup.find(
                  id="current-week"
              )


              if current:

                  current.string = (
                      f"Week "
                      f"{current_matchup_period}"
                  )


              power_heading = soup.find(
                  id="power-rankings-heading"
              )


              if power_heading:

                  power_heading.string = (
                      f"Week "
                      f"{current_matchup_period} "
                      f"Power Rankings"
                  )


              power_card = soup.find(
                  id="power-rankings"
              )


              if power_card:

                  for row in power_card.select(
                      "[data-team-id]"
                  ):

                      tid = safe_int(
                          row.get(
                              "data-team-id",
                              0
                          )
                      )


                      if tid in teams_by_id:

                          el = row.select_one(
                              ".standing-info"
                          )


                          if el:

                              el.string = (
                                  teams_by_id[
                                      tid
                                  ]["name"]
                              )


              # Total = all ESPN acquisition counts
              # $1 per acquisition

              total_adds = sum(
                  safe_int(
                      team.get(
                          "acquisitions",
                          0
                      )
                  )
                  for team in normalized[
                      "teams"
                  ]
              )


              transaction_total = soup.find(
                  id="league-transaction-total"
              )


              if transaction_total:

                  transaction_total.string = (
                      f"${total_adds}"
                  )


                  print(
                      "HOME transaction total: "
                      f"${total_adds}"
                  )


              path.write_text(
                  str(soup),
                  encoding="utf-8"
              )


          # ==========================================
          # RUN ALL UPDATES
          # ==========================================

          update_rosters()

          update_matchups()

          update_standings()

          update_transactions()

          update_home()


          print(
              "SYNC COMPLETE"
          )

          PY


      - name: Commit only when something changed
        run: |

          if git diff --quiet; then
            echo "No league changes detected."
            exit 0
          fi

          git config user.name \
            "Any Given Sunday Bot"

          git config user.email \
            "actions@users.noreply.github.com"

          git add \
            rosters.html \
            matchups.html \
            standings.html \
            transactions.html \
            index.html \
            data/live.json

          git commit \
            -m "Auto-update Any Given Sunday league data"

          git push